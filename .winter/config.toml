# ===========================================================================
# Provisioning — `winter provision <env>` lifecycle handlers
#
# Dependency install: one feature-environment handler per project that needs
# deps. `project = "<name>"` (paul-gross/winter#105) sets cwd to that repo's
# worktree (<env>/<name>/) with parse-time validation against [[project_repository]]
# and a hard error if the worktree is missing — preferred over a hand-rolled `cd`.
# ===========================================================================

[[provision.dependency]]
scope = "feature-environment"
project = "winter-workspace"
apply = "cd tools/winter-cli && mise trust . && mise run install"

[[provision.dependency]]
scope = "feature-environment"
project = "winter-test-service"
# --python 3.12: uv now prefers a managed 3.14, which the locked psycopg-binary has no wheel for.
apply = "uv sync --python 3.12 && (cd web && npm install --no-audit --no-fund)"

# ===========================================================================
# Per-env RabbitMQ slice — carves a vhost + user `wts-<env>` out of the shared
# workspace broker (container `wdv-rabbitmq`, declared scope="workspace" in the
# docker manifest). `required_services` gates on it being up first; cwd = env
# root; WINTER_ENV is set. apply is idempotent (skip add_* when present, always
# re-assert permissions); destroy tolerates already-gone entities.
# ===========================================================================

[[provision.resource]]
scope = "feature-environment"
apply = [
  "docker exec wdv-rabbitmq rabbitmqctl list_vhosts --quiet | grep -qx \"wts-$WINTER_ENV\" || docker exec wdv-rabbitmq rabbitmqctl add_vhost \"wts-$WINTER_ENV\"",
  "docker exec wdv-rabbitmq rabbitmqctl list_users --quiet | awk '{print $1}' | grep -qx \"wts-$WINTER_ENV\" || docker exec wdv-rabbitmq rabbitmqctl add_user \"wts-$WINTER_ENV\" \"wts-$WINTER_ENV\"",
  "docker exec wdv-rabbitmq rabbitmqctl set_permissions -p \"wts-$WINTER_ENV\" \"wts-$WINTER_ENV\" '.*' '.*' '.*'",
]
destroy = [
  "docker exec wdv-rabbitmq rabbitmqctl delete_vhost \"wts-$WINTER_ENV\" || true",
  "docker exec wdv-rabbitmq rabbitmqctl delete_user \"wts-$WINTER_ENV\" || true",
]
required_services = ["workspace/rabbitmq"]

# ===========================================================================
# Per-env Postgres slice — carves a database + role `wts_<env>` out of the
# shared workspace Postgres (container `wdv-postgres`, scope="workspace" in the
# docker manifest), mirroring the RabbitMQ vhost above. `required_services` gates
# on it being up; WINTER_ENV is set; `wts` is the bootstrap superuser. apply is
# idempotent (skip CREATE when the role/db already exists); destroy tolerates
# already-gone entities and force-drops the db to evict live app connections.
# ===========================================================================

[[provision.resource]]
scope = "feature-environment"
apply = [
  "docker exec wdv-postgres psql -U wts -tAc \"SELECT 1 FROM pg_roles WHERE rolname='wts_$WINTER_ENV'\" | grep -q 1 || docker exec wdv-postgres psql -U wts -c \"CREATE ROLE wts_$WINTER_ENV LOGIN PASSWORD 'wts_$WINTER_ENV'\"",
  "docker exec wdv-postgres psql -U wts -tAc \"SELECT 1 FROM pg_database WHERE datname='wts_$WINTER_ENV'\" | grep -q 1 || docker exec wdv-postgres psql -U wts -c \"CREATE DATABASE wts_$WINTER_ENV OWNER wts_$WINTER_ENV\"",
]
destroy = [
  "docker exec wdv-postgres psql -U wts -c \"DROP DATABASE IF EXISTS wts_$WINTER_ENV WITH (FORCE)\" || true",
  "docker exec wdv-postgres psql -U wts -c \"DROP ROLE IF EXISTS wts_$WINTER_ENV\" || true",
]
required_services = ["workspace/db"]

# ===========================================================================
# Lint suppressions the workspace declares on behalf of a repo it cannot fix
# from here. Repo-owned exemptions belong in that repo's own winter-ext.toml;
# these are the cases where the finding is an artifact of where the linter
# stands, not of the repo's content.
# ===========================================================================

[lint.ignore.repo."winter-workspace".checks]
# The setup skill installs these four into a workspace and links them as
# `workspace:/context/…` — correct, because they describe the workspace being
# set up, not winter's own copies. Orphan detection resolves `workspace:` to
# this workspace rather than to the repo it is scanning, so it cannot see the
# skill routing them and reads all four as unreachable.
doc-references = [
  "context/winter/setup/contributing.md",
  "context/winter/setup/project-setup.md",
  "context/winter/setup/service-discovery.md",
  "context/winter/setup/service-orchestration.md",
]
